name: PR comment

# Posts the result of the Tests workflow as a comment on the PR.
# Runs via workflow_run (with write access) AFTER Tests, but never executes code from
# the PR — it only reads the saved result. Only works once this file is on main.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pr-result
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The number comes from a (possibly forked) PR run — accept digits only.
      - id: pr
        run: echo "number=$(grep -E '^[0-9]+$' number)" >> "$GITHUB_OUTPUT"

      # Third-party action with write access: pinned to a commit, not a movable tag.
      - uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          number: ${{ steps.pr.outputs.number }}
          path: comment.md

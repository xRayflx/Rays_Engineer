name: Release

# Creating a branch release/<version> from main (e.g. release/1.2.0 or
# release/1.2.0-beta.1) builds the installer and publishes GitHub release v<version>.

on:
  create:

permissions:
  contents: write

jobs:
  release:
    if: github.ref_type == 'branch' && startsWith(github.ref_name, 'release/')
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: Rays_Engineer.Desktop
    steps:
      - uses: actions/checkout@v4

      - name: Read version from branch name
        id: ver
        run: |
          V="${GITHUB_REF_NAME#release/}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid version '$V'. Expected e.g. release/1.2.0"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Rays_Engineer.Desktop/package-lock.json

      - run: npm ci
      # electron-builder takes the installer version from package.json.
      - run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - run: node scripts/smoke-test.cjs "release/win-unpacked/Rays Engineer.exe"

      # Third-party action with write access: pinned to a commit, not a movable tag.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: Rays_Engineer.Desktop/release/*.exe

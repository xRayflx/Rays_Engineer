name: PR rules

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read

jobs:
  issue-link:
    runs-on: ubuntu-latest
    steps:
      # The PR body goes through env:, never ${{ }} inside the script — otherwise a
      # crafted description could inject shell commands.
      - name: Check issue reference
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          ISSUES=$(printf '%s' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u)

          if [[ -z "$ISSUES" ]]; then
            echo "::error::The PR description must reference an issue, e.g. 'Closes #42'"
            exit 1
          fi

          for ISSUE in $ISSUES; do
            STATE=$(gh issue view "$ISSUE" --repo "$REPO" --json state -q .state 2>/dev/null) || {
              echo "::error::Issue #$ISSUE does not exist (or is a pull request)"
              exit 1
            }
            if [[ "$STATE" != "OPEN" ]]; then
              echo "::error::Issue #$ISSUE is not open (state: $STATE)"
              exit 1
            fi
            echo "✅ References open issue #$ISSUE"
          done

  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA agreement
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [[ "$AUTHOR" == "$OWNER" || "$AUTHOR" == *"[bot]" ]]; then
            echo "Maintainer or bot, no CLA needed"
            exit 0
          fi

          if printf '%s' "$BODY" | grep -qiE '\[x\][[:space:]]*I agree to the CLA'; then
            echo "✅ CLA accepted by $AUTHOR"
          else
            echo "::error::Please tick the checkbox in the PR description: - [x] I agree to the CLA (CLA.md)"
            exit 1
          fi
